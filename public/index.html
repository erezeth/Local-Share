<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#080e1a" id="themeColor" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Local Share</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080e1a;
    --panel: #0f172a;
    --panel-2: #16213a;
    --input-bg: #0b1425;
    --border: #26324a;
    --border-strong: #34425e;
    --text: #e8eef9;
    --text-soft: #c7d2e5;
    --muted: #92a1b9;
    --accent: #4f8cff;
    --accent-2: #8b5cf6;
    --accent-soft: rgba(79, 140, 255, .15);
    --focus: rgba(79, 140, 255, .30);
    --success: #4ade80;
    --success-soft: rgba(74, 222, 128, .14);
    --warning: #fbbf24;
    --danger: #fb7185;
    --bubble: #121d33;
    --overlay: rgba(2, 6, 17, .74);
    --shadow: 0 18px 48px rgba(0, 0, 0, .35);
    --shadow-soft: 0 6px 20px rgba(0, 0, 0, .18);
    --glow: rgba(79, 140, 255, .14);
    --scroll: #2c3a55;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f6fc;
    --panel: #ffffff;
    --panel-2: #eef3fb;
    --input-bg: #f8faff;
    --border: #dce4f0;
    --border-strong: #c8d4e6;
    --text: #101a2e;
    --text-soft: #334155;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --accent-soft: rgba(37, 99, 235, .10);
    --focus: rgba(37, 99, 235, .22);
    --success: #15803d;
    --success-soft: rgba(21, 128, 61, .10);
    --warning: #b45309;
    --danger: #dc2626;
    --bubble: #ffffff;
    --overlay: rgba(15, 23, 42, .44);
    --shadow: 0 18px 48px rgba(15, 23, 42, .12);
    --shadow-soft: 0 6px 20px rgba(15, 23, 42, .06);
    --glow: rgba(37, 99, 235, .08);
    --scroll: #cbd5e1;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    scrollbar-color: var(--scroll) transparent;
    scrollbar-width: thin;
  }
  html, body {
    margin: 0;
    height: 100dvh;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }
  body {
    font: 16px/1.5 var(--font);
    color: var(--text);
    background:
      radial-gradient(circle at 10% 0%, var(--glow), transparent 34rem),
      radial-gradient(circle at 100% 100%, var(--glow), transparent 30rem),
      var(--bg);
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; }
  button { color: inherit; }
  button, select { cursor: pointer; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* layout */
  #app {
    display: grid;
    height: 100dvh;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    grid-template-areas: "header" "chat" "footer";
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 768px) {
    #app {
      grid-template-columns: 280px minmax(0, 1fr);
      grid-template-rows: 1fr auto;
      grid-template-areas:
        "sidebar chat"
        "sidebar footer";
    }
  }

  /* header */
  #header {
    grid-area: header;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  .header-actions { display: flex; align-items: center; gap: 6px; }
  #header .name-chip {
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: inherit;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #header .name-chip:hover { background: var(--border); }
  #header .name-chip .name-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  #header .name-chip .pencil { font-size: 11px; opacity: .7; flex: 0 0 auto; }
  #header .name-chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger); flex: 0 0 auto;
    transition: background .2s;
  }
  #header .name-chip .dot.online { background: var(--success); }
  #header .icon-btn { padding: 8px 10px; font-size: 14px; }
  @media (min-width: 768px) { #header { display: none; } }

  /* sidebar */
  #sidebar {
    grid-area: sidebar;
    display: none;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
    min-height: 0;
    min-width: 0;
  }
  @media (min-width: 768px) { #sidebar { display: flex; } }
  .brand {
    font-weight: 700; font-size: 16px; letter-spacing: .2px;
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    width: 34px; height: 34px; flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 18px; font-weight: 800;
    box-shadow: 0 8px 18px var(--accent-soft);
  }
  .section {
    margin-top: 18px; flex: 1; min-height: 0;
    display: flex; flex-direction: column;
  }
  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .9px;
    color: var(--muted); margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #userCount, #drawerCount {
    min-width: 24px; padding: 2px 7px;
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text-soft);
    font-size: 10px; line-height: 1.5; text-align: center; letter-spacing: 0;
  }
  #userList {
    list-style: none; padding: 0; margin: 0;
    overflow-y: auto; flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 3px;
  }
  #userList li {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 10px; border-radius: 10px;
    font-size: 14px; color: var(--text-soft);
    transition: background .15s, color .15s;
  }
  #userList li:hover { background: var(--panel-2); color: var(--text); }
  #userList li.me { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); flex: 0 0 auto;
    box-shadow: 0 0 0 3px var(--success-soft);
  }
  .me-bar {
    margin-top: 12px; padding: 10px 12px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
    display: flex; align-items: center; gap: 8px; font-size: 13px;
  }
  .me-bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .me-bar button {
    background: transparent; border: 0; cursor: pointer;
    padding: 6px 8px; border-radius: 6px; font-size: 14px;
  }
  .me-bar button:hover { background: var(--border); }
  .side-actions { display: flex; gap: 8px; margin-top: 12px; }
  .side-actions .icon-btn { min-height: 44px; }
  #qrBtn2 { flex: 1 1 auto; font-size: 13px; }

  /* chat */
  #chat {
    grid-area: chat;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    min-height: 0;
    min-width: 0;
  }
  #messages { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  @media (min-width: 768px) {
    #chat { padding: 28px 40px; }
    #messages { max-width: 780px; margin: 0 auto; width: 100%; }
  }
  .msg {
    max-width: min(80%, 620px); padding: 10px 14px;
    background: var(--bubble); border: 1px solid var(--border);
    border-radius: 6px 16px 16px 16px;
    box-shadow: var(--shadow-soft);
    word-break: break-word; overflow-wrap: anywhere;
    animation: pop .15s ease-out;
    min-width: 0;
    transition: background-color .2s, border-color .2s, color .2s;
  }
  @media (min-width: 768px) { .msg { max-width: min(70%, 620px); } }
  @keyframes pop {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  .msg.me {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff;
    border-radius: 16px 6px 16px 16px;
  }
  .msg .from { font-size: 11px; font-weight: 600; letter-spacing: .2px; color: var(--muted); margin-bottom: 4px; }
  .msg.me .from { color: rgba(255, 255, 255, .78); }
  .msg img, .msg video {
    max-width: 100%; height: auto;
    border-radius: 10px; display: block; margin-bottom: 6px;
  }
  .msg a { color: var(--accent); word-break: break-all; text-underline-offset: 2px; }
  .msg.me a { color: #fff; }
  .status {
    align-self: center; font-size: 12px; color: var(--muted);
    text-align: center; padding: 5px 12px;
    max-width: 100%; overflow-wrap: anywhere;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px;
  }
  .status.warn { color: var(--warning); }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--success); }
  .status.transfer {
    width: min(420px, 88%);
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 12px; border-radius: 14px;
    background: var(--panel); text-align: left;
    box-shadow: var(--shadow-soft);
  }
  .status.transfer .transfer-text {
    font-size: 12px; color: var(--text-soft);
    overflow-wrap: anywhere;
  }
  .status.transfer progress {
    width: 100%; height: 7px; border: 0; border-radius: 999px;
    overflow: hidden; background: var(--panel-2);
  }
  .status.transfer progress::-webkit-progress-bar {
    background: var(--panel-2); border-radius: 999px;
  }
  .status.transfer progress::-webkit-progress-value {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px;
  }
  .status.transfer progress::-moz-progress-bar {
    background: var(--accent); border-radius: 999px;
  }
  .status.transfer.ok .transfer-text { color: var(--success); }
  .status.transfer.error .transfer-text { color: var(--danger); }

  /* footer */
  #footer {
    grid-area: footer;
    display: flex; gap: 8px; align-items: center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--border);
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  @media (min-width: 768px) {
    #footer { padding: 14px 32px 18px; justify-content: center; }
    #footer > #textInput { max-width: 720px; }
  }
  #textInput {
    flex: 1 1 auto; min-width: 0;
    padding: 11px 14px; border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text);
    font-size: 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  #textInput::placeholder { color: var(--muted); }
  #textInput:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .icon-btn, .primary-btn {
    flex: 0 0 auto;
    border-radius: 12px;
    min-width: 44px; min-height: 44px;
    padding: 10px 14px; font-size: 15px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
    transition: transform .05s;
  }
  .icon-btn { background: var(--panel-2); border: 1px solid var(--border); }
  .icon-btn:hover { background: var(--border); }
  .primary-btn {
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 8px 18px var(--accent-soft);
  }
  .primary-btn:hover { filter: brightness(1.07); }
  .primary-btn:active, .icon-btn:active { transform: scale(.96); }
  .theme-btn { font-size: 16px; }
  #fileInput { display: none; }
  #targetSelect {
    flex: 0 1 108px; min-width: 76px;
    height: 44px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel-2); color: var(--text);
    font-size: 13px;
  }
  #targetSelect:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  #connStatus {
    display: flex; align-items: center; gap: 6px;
    flex: 0 0 auto; min-width: 0;
    padding: 6px 9px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--panel-2);
  }
  #connLabel {
    font-size: 11px; color: var(--muted); line-height: 1;
    min-width: 42px; white-space: nowrap;
  }
  #connStatus.online #connLabel { color: var(--success); }
  #connStatus.connecting #connLabel { color: var(--warning); }
  #connDot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger); flex: 0 0 auto;
    transition: background .2s;
  }
  #connDot.online { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }

  /* drawer */
  #drawer {
    position: fixed; inset: 0;
    background: var(--overlay);
    z-index: 150;
    display: none;
  }
  #drawer.open { display: block; }
  #drawer .panel {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: min(84vw, 320px);
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
    box-shadow: var(--shadow);
    animation: slideIn .18s ease-out;
  }
  @keyframes slideIn { from { transform: translateX(-100%); } to { transform: none; } }
  #drawer h4 {
    margin: 0 0 12px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted);
    display: flex; justify-content: space-between;
  }
  #drawer #drawerUserList {
    list-style: none; padding: 0; margin: 0; flex: 1;
    overflow-y: auto; display: flex; flex-direction: column; gap: 3px;
  }
  #drawer #drawerUserList li {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 10px; border-radius: 10px; font-size: 14px;
    color: var(--text-soft);
  }
  #drawer #drawerUserList li.me {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }
  #drawer .close-btn {
    margin-top: 12px; padding: 10px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--border); color: inherit;
    font-size: 14px; cursor: pointer;
  }
  #drawer .close-btn:hover { background: var(--border); }

  /* overlay */
  .overlay {
    position: fixed; inset: 0;
    background: var(--overlay);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  .overlay[hidden] { display: none; }
  .overlay-card {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border);
    border-radius: 18px; padding: 24px;
    width: 360px; max-width: 90vw;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: var(--shadow);
    animation: popIn .18s ease-out;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .overlay-card h3 { margin: 0; font-size: 18px; letter-spacing: -.2px; }
  .overlay-card p { margin: 0; font-size: 13px; color: var(--muted); }
  .overlay-card input {
    padding: 11px 12px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--input-bg); color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  .overlay-card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .overlay-card .ghost-btn {
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    touch-action: manipulation;
    transition: background .15s, color .15s, border-color .15s;
  }
  .overlay-card .ghost-btn:hover:not(:disabled) {
    background: var(--panel-2);
    color: var(--text);
    border-color: var(--border-strong);
  }
  .overlay-card .ghost-btn:disabled { opacity: .6; cursor: wait; }
  .overlay-card .divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: .8px;
  }
  .overlay-card .divider::before,
  .overlay-card .divider::after {
    content: '';
    flex: 1; height: 1px; background: var(--border);
  }
  .overlay-card .error-text {
    min-height: 1.2em; margin: 0; font-size: 12px; color: var(--danger);
  }
  #qrModal img {
    width: min(280px, 75vw);
    background: #fff; padding: 8px; border-radius: 12px;
    display: block; margin: 0 auto;
  }
  #qrModal .url {
    font-size: 12px; color: var(--muted);
    margin-top: 10px; word-break: break-all;
    text-align: center;
  }

  /* dropzone */
  #dropzone {
    position: fixed; inset: 0;
    z-index: 300;
    margin: 16px;
    border: 3px dashed var(--accent);
    border-radius: 22px;
    background: rgba(3, 7, 18, .86);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600;
    pointer-events: none;
  }
  #dropzone[hidden] { display: none; }

  /* accessibility */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* breakpoints */
  @media (min-width: 768px) and (max-width: 1024px) {
    #app { grid-template-columns: 240px minmax(0, 1fr); }
    #sidebar { padding: 16px 12px; }
    #chat { padding: 20px 24px; }
    #footer { padding: 12px 20px 16px; }
  }
  @media (max-width: 520px) {
    #connLabel { display: none; }
    #targetSelect { flex-basis: 82px; min-width: 68px; font-size: 12px; padding: 0 6px; }
  }
  @media (max-width: 359px) {
    #header { padding-left: 6px; padding-right: 6px; gap: 4px; }
    #header .icon-btn { padding: 7px 9px; min-width: 36px; min-height: 36px; font-size: 13px; }
    #header .name-chip { padding: 7px 10px; font-size: 13px; gap: 4px; }
    #footer { gap: 6px; padding-left: 8px; padding-right: 8px; }
    .msg { max-width: 88%; }
    #targetSelect { flex-basis: 70px; min-width: 62px; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    #header { padding-top: calc(6px + env(safe-area-inset-top)); padding-bottom: 6px; }
    #footer { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
    .msg { font-size: 14px; }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">⇄</span>
      <span>Local Share</span>
    </div>
    <div class="section">
      <div class="section-title">
        <span>Online</span>
        <span id="userCount">0</span>
      </div>
      <ul id="userList"></ul>
    </div>
    <div class="side-actions">
      <button id="qrBtn2" class="icon-btn" type="button">Tampilkan QR</button>
      <button id="themeBtn2" class="icon-btn theme-btn" type="button" aria-label="Ganti tema">☀️</button>
    </div>
    <div class="me-bar">
      <span id="myNameLabel">-</span>
      <button id="editNameBtn" type="button" title="Ganti nama">✏️</button>
    </div>
  </aside>

  <header id="header">
    <button id="menuBtn" class="icon-btn" type="button" aria-label="Menu">☰</button>
    <button id="myNameBtn" class="name-chip" type="button" title="Ganti nama">
      <span class="dot"></span>
      <span class="name-text" id="myNameText">-</span>
      <span class="pencil">✏️</span>
    </button>
    <div class="header-actions">
      <button id="themeBtn" class="icon-btn theme-btn" type="button" aria-label="Ganti tema">☀️</button>
      <button id="qrBtn" class="icon-btn" type="button" aria-label="QR">QR</button>
    </div>
  </header>

  <main id="chat"><div id="messages"></div></main>

  <footer id="footer">
    <span id="connStatus" class="conn-status" role="status" title="Status koneksi">
      <span id="connDot" aria-hidden="true"></span>
      <span id="connLabel">Offline</span>
    </span>
    <button id="fileBtn" class="icon-btn" type="button" aria-label="Kirim file">📎</button>
    <input type="file" id="fileInput" multiple />
    <label class="sr-only" for="targetSelect">Penerima</label>
    <select id="targetSelect" aria-label="Penerima" title="Pilih penerima">
      <option value="">Semua</option>
    </select>
    <input type="text" id="textInput" placeholder="Ketik pesan..."
           autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" enterkeyhint="send" />
    <button id="sendBtn" class="primary-btn" type="button">Kirim</button>
  </footer>
</div>

<div id="drawer">
  <div class="panel">
    <h4><span>Online</span><span id="drawerCount">0</span></h4>
    <ul id="drawerUserList"></ul>
    <button class="close-btn" id="drawerClose" type="button">Tutup</button>
  </div>
</div>

<div id="authOverlay" class="overlay" hidden>
  <div class="overlay-card">
    <h3>Akses diperlukan</h3>
    <p>Masukkan token akses yang ditampilkan di terminal server.</p>
    <input id="tokenInput" type="password" maxlength="512" placeholder="Token akses"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <button id="tokenOk" class="primary-btn" type="button">Hubungkan</button>
    <p id="authError" class="error-text" role="alert"></p>
  </div>
</div>

<div id="nameOverlay" class="overlay" hidden>
  <div class="overlay-card">
    <h3>Masuk sebagai</h3>
    <p>Nama sementara hilang saat tab ditutup.</p>
    <input id="nameInput" maxlength="20" placeholder="cth: budi"
           autocomplete="off" autocorrect="off" autocapitalize="off" />
    <button id="nameOk" class="primary-btn" type="button">Mulai</button>
    <div class="divider">atau</div>
    <button id="guestBtn" class="ghost-btn" type="button">Continue as guest</button>
  </div>
</div>

<div id="qrModal" class="overlay" hidden>
  <div class="overlay-card">
    <img id="qrImg" alt="QR" />
    <div class="url" id="qrUrl"></div>
    <button class="primary-btn" id="qrClose" type="button">Tutup</button>
  </div>
</div>

<div id="dropzone" hidden>Lepas file di sini</div>

<script src="/app.js" defer></script>
</body>
</html>
