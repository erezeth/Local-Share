<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Local Share</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --panel2: #182444;
    --border: #23304f;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --radius: 12px;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body {
    margin: 0;
    height: 100dvh;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  /* layout */
  #app {
    display: grid;
    height: 100dvh;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    grid-template-areas: "header" "chat" "footer";
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 768px) {
    #app {
      grid-template-columns: 260px minmax(0, 1fr);
      grid-template-rows: 1fr auto;
      grid-template-areas:
        "sidebar chat"
        "sidebar footer";
    }
  }

  /* header */
  #header {
    grid-area: header;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 6px;
    padding: calc(8px + env(safe-area-inset-top)) 8px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  #header .name-chip {
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 999px;
    background: var(--panel2);
    border: 0;
    color: inherit;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .15s;
  }
  #header .name-chip:hover { background: var(--border); }
  #header .name-chip .name-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  #header .name-chip .pencil {
    font-size: 11px; opacity: .7; flex: 0 0 auto;
  }
  #header .name-chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444; flex: 0 0 auto;
    transition: background .2s;
  }
  #header .name-chip .dot.online { background: #22c55e; }
  #header .icon-btn {
    padding: 8px 10px;
    font-size: 14px;
    min-width: 40px;
    min-height: 40px;
    width: auto;
    flex: 0 0 auto;
  }
  @media (min-width: 768px) { #header { display: none; } }

  /* sidebar */
  #sidebar {
    grid-area: sidebar;
    display: none;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
    min-height: 0;
    min-width: 0;
  }
  @media (min-width: 768px) { #sidebar { display: flex; } }
  .brand {
    font-weight: 700; font-size: 16px; letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .section {
    margin-top: 20px; flex: 1; min-height: 0;
    display: flex; flex-direction: column;
  }
  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin-bottom: 10px;
    display: flex; justify-content: space-between;
  }
  #userList {
    list-style: none; padding: 0; margin: 0;
    overflow-y: auto; flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  #userList li {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px;
    font-size: 14px; color: #cbd5e1;
  }
  #userList li.me { background: var(--panel2); color: var(--text); font-weight: 600; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; flex: 0 0 auto;
    box-shadow: 0 0 0 3px rgba(34,197,94,.15);
  }
  .me-bar {
    margin-top: 12px; padding: 10px 12px;
    background: var(--panel2); border-radius: 10px;
    display: flex; align-items: center; gap: 8px; font-size: 13px;
  }
  .me-bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .me-bar button {
    background: transparent; border: 0; cursor: pointer;
    padding: 6px 8px; border-radius: 6px; font-size: 14px;
  }
  .me-bar button:hover { background: var(--border); }
  .side-actions { display: flex; gap: 8px; margin-top: 12px; }

  /* chat */
  #chat {
    grid-area: chat;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 12px;
    min-height: 0;
    min-width: 0;
  }
  #messages { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  @media (min-width: 768px) {
    #chat { padding: 24px 32px; }
    #messages { max-width: 720px; margin: 0 auto; width: 100%; }
  }
  .msg {
    max-width: 80%; padding: 8px 12px;
    background: var(--panel); border-radius: var(--radius);
    word-break: break-word; overflow-wrap: anywhere;
    animation: pop .15s ease-out;
    min-width: 0;
  }
  @media (min-width: 768px) { .msg { max-width: 70%; } }
  @keyframes pop {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  .msg.me { align-self: flex-end; background: var(--accent); }
  .msg .from { font-size: 11px; opacity: .7; margin-bottom: 4px; }
  .msg img, .msg video {
    max-width: 100%; height: auto;
    border-radius: 8px; display: block; margin-bottom: 6px;
  }
  .msg a { color: #bfdbfe; word-break: break-all; }
  .msg.me a { color: #fff; }
  .status {
    align-self: center; font-size: 12px; color: var(--muted);
    text-align: center; padding: 4px 8px;
    max-width: 100%; overflow-wrap: anywhere;
  }

  /* footer */
  #footer {
    grid-area: footer;
    display: flex; gap: 8px; align-items: center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--border);
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  @media (min-width: 768px) {
    #footer { padding: 14px 32px 18px; justify-content: center; }
    #footer > #textInput { max-width: 720px; }
  }
  #textInput {
    flex: 1 1 auto; min-width: 0;
    padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg); color: inherit;
    font-size: 16px;
    -webkit-appearance: none; appearance: none;
    transition: border-color .15s;
  }
  #textInput:focus { outline: none; border-color: var(--accent); }
  .icon-btn, .primary-btn {
    flex: 0 0 auto;
    border: 0; border-radius: 10px;
    min-width: 44px; min-height: 44px;
    padding: 10px 14px; font-size: 15px;
    cursor: pointer; touch-action: manipulation;
    transition: background .15s, transform .05s;
  }
  .icon-btn { background: var(--panel2); }
  .icon-btn:hover { background: var(--border); }
  .primary-btn { background: var(--accent); color: #fff; font-weight: 600; }
  .primary-btn:hover { background: var(--accent-hover); }
  .primary-btn:active, .icon-btn:active { transform: scale(.96); }
  #fileInput { display: none; }
  #connDot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444; flex: 0 0 auto;
    transition: background .2s;
  }
  #connDot.online { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }

  /* drawer */
  #drawer {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 150;
    display: none;
  }
  #drawer.open { display: block; }
  #drawer .panel {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: min(80vw, 300px);
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
    animation: slideIn .18s ease-out;
  }
  @keyframes slideIn { from { transform: translateX(-100%); } to { transform: none; } }
  #drawer h4 {
    margin: 0 0 12px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted);
    display: flex; justify-content: space-between;
  }
  #drawer #drawerUserList {
    list-style: none; padding: 0; margin: 0; flex: 1;
    overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
  }
  #drawer #drawerUserList li {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; font-size: 14px;
    color: #cbd5e1;
  }
  #drawer #drawerUserList li.me {
    background: var(--panel2); color: var(--text); font-weight: 600;
  }
  #drawer .close-btn {
    margin-top: 12px; padding: 10px; border-radius: 10px;
    background: var(--panel2); border: 0; color: inherit;
    font-size: 14px; cursor: pointer;
  }
  #drawer .close-btn:hover { background: var(--border); }

  /* overlay */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  .overlay[hidden] { display: none; }
  .overlay-card {
    background: var(--panel); color: var(--text);
    border-radius: 14px; padding: 22px;
    width: 340px; max-width: 90vw;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: var(--shadow);
    animation: popIn .18s ease-out;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .overlay-card h3 { margin: 0; font-size: 17px; }
  .overlay-card p { margin: 0; font-size: 13px; color: var(--muted); }
  .overlay-card input {
    padding: 10px 12px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: inherit;
    -webkit-appearance: none; appearance: none;
  }
  .overlay-card input:focus { outline: none; border-color: var(--accent); }
  .overlay-card .ghost-btn {
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    touch-action: manipulation;
    transition: background .15s, color .15s, border-color .15s;
  }
  .overlay-card .ghost-btn:hover:not(:disabled) {
    background: var(--panel2);
    color: var(--text);
    border-color: var(--panel2);
  }
  .overlay-card .ghost-btn:disabled { opacity: .6; cursor: wait; }
  .overlay-card .divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: .8px;
  }
  .overlay-card .divider::before,
  .overlay-card .divider::after {
    content: '';
    flex: 1; height: 1px; background: var(--border);
  }
  #qrModal img {
    width: min(280px, 75vw);
    background: #fff; padding: 8px; border-radius: 10px;
    display: block; margin: 0 auto;
  }
  #qrModal .url {
    font-size: 12px; color: var(--muted);
    margin-top: 10px; word-break: break-all;
    text-align: center;
  }

  /* dropzone */
  #dropzone {
    position: fixed; inset: 0;
    z-index: 300;
    margin: 16px;
    border: 3px dashed var(--accent);
    border-radius: 20px;
    background: rgba(11,18,32,.85);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600;
    pointer-events: none;
  }
  #dropzone[hidden] { display: none; }

  /* breakpoints */
  @media (min-width: 768px) and (max-width: 1024px) {
    #app { grid-template-columns: 220px minmax(0, 1fr); }
    #sidebar { padding: 16px 12px; }
    #chat { padding: 18px 20px; }
    #footer { padding: 12px 20px 16px; }
  }
  @media (max-width: 359px) {
    #header { padding-left: 6px; padding-right: 6px; gap: 4px; }
    #header .icon-btn { padding: 7px 9px; min-width: 36px; min-height: 36px; font-size: 13px; }
    #header .name-chip { padding: 7px 10px; font-size: 13px; gap: 4px; }
    #footer { gap: 6px; padding-left: 8px; padding-right: 8px; }
    .msg { max-width: 88%; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    #header { padding-top: calc(6px + env(safe-area-inset-top)); padding-bottom: 6px; }
    #footer { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
    .msg { font-size: 14px; }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">Local Share</div>
    <div class="section">
      <div class="section-title">
        <span>Online</span>
        <span id="userCount">0</span>
      </div>
      <ul id="userList"></ul>
    </div>
    <div class="side-actions">
      <button id="qrBtn2" class="icon-btn" style="flex:1">Tampilkan QR</button>
    </div>
    <div class="me-bar">
      <span id="myNameLabel">-</span>
      <button id="editNameBtn" title="Ganti nama">✏️</button>
    </div>
  </aside>

  <header id="header">
    <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
    <button id="myNameBtn" class="name-chip" title="Ganti nama">
      <span class="dot"></span>
      <span class="name-text" id="myNameText">-</span>
      <span class="pencil">✏️</span>
    </button>
    <button id="qrBtn" class="icon-btn" aria-label="QR">QR</button>
  </header>

  <main id="chat"><div id="messages"></div></main>

  <footer id="footer">
    <span id="connDot" title="Status koneksi"></span>
    <button id="fileBtn" class="icon-btn" aria-label="Kirim file">📎</button>
    <input type="file" id="fileInput" multiple />
    <input type="text" id="textInput" placeholder="Ketik pesan..."
           autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" enterkeyhint="send" />
    <button id="sendBtn" class="primary-btn">Kirim</button>
  </footer>
</div>

<div id="drawer">
  <div class="panel">
    <h4><span>Online</span><span id="drawerCount">0</span></h4>
    <ul id="drawerUserList"></ul>
    <button class="close-btn" id="drawerClose">Tutup</button>
  </div>
</div>

<div id="nameOverlay" class="overlay" hidden>
  <div class="overlay-card">
    <h3>Masuk sebagai</h3>
    <p>Nama sementara hilang saat tab ditutup.</p>
    <input id="nameInput" maxlength="20" placeholder="cth: budi"
           autocomplete="off" autocorrect="off" autocapitalize="off" />
    <button id="nameOk" class="primary-btn">Mulai</button>
    <div class="divider">atau</div>
    <button id="guestBtn" class="ghost-btn" type="button">Continue as guest</button>
  </div>
</div>

<div id="qrModal" class="overlay" hidden>
  <div class="overlay-card">
    <img id="qrImg" alt="QR" />
    <div class="url" id="qrUrl"></div>
    <button class="primary-btn" id="qrClose">Tutup</button>
  </div>
</div>

<div id="dropzone" hidden>Lepas file di sini</div>

<script>
(() => {
  'use strict';

  /* refs */
  const chat          = document.getElementById('chat');
  const messages      = document.getElementById('messages');
  const textInput     = document.getElementById('textInput');
  const sendBtn       = document.getElementById('sendBtn');
  const fileBtn       = document.getElementById('fileBtn');
  const fileInput     = document.getElementById('fileInput');
  const userList      = document.getElementById('userList');
  const userCount     = document.getElementById('userCount');
  const myNameLabel   = document.getElementById('myNameLabel');
  const menuBtn       = document.getElementById('menuBtn');
  const myNameBtn     = document.getElementById('myNameBtn');
  const myNameText    = document.getElementById('myNameText');
  const drawer        = document.getElementById('drawer');
  const drawerClose   = document.getElementById('drawerClose');
  const drawerUserList= document.getElementById('drawerUserList');
  const drawerCount   = document.getElementById('drawerCount');
  const nameOverlay   = document.getElementById('nameOverlay');
  const nameInput     = document.getElementById('nameInput');
  const nameOk        = document.getElementById('nameOk');
  const guestBtn      = document.getElementById('guestBtn');
  const qrModal       = document.getElementById('qrModal');
  const qrImg         = document.getElementById('qrImg');
  const qrUrl         = document.getElementById('qrUrl');
  const connDot       = document.getElementById('connDot');
  const dropzone      = document.getElementById('dropzone');

  /* config */
  const MAX_MESSAGES = 200;
  const CHUNK        = 16 * 1024;
  const HIGH_WATER   = 512 * 1024;
  const WARN_SIZE    = 100 * 1024 * 1024;
  const WS_URL       = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  const sleep        = ms => new Promise(r => setTimeout(r, ms));
  const rAF          = cb => requestAnimationFrame(cb);

  /* storage */
  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch {} }
  };

  /* state */
  let clientId = store.get('ls_cid');
  if (!clientId) {
    clientId = 'c' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    store.set('ls_cid', clientId);
  }

  let myName = store.get('ls_name') || '';

  let ws           = null;
  let pingTimer    = null;
  let connWatchdog = null;
  let guestTimer   = null;

  const incoming = new Map();
  const blobUrls = [];
  const outbox   = [];

  /* util */
  const fmtSize = n => {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
    return (n/1073741824).toFixed(2) + ' GB';
  };

  /* render */
  function appendMessage(node) {
    messages.appendChild(node);
    while (messages.children.length > MAX_MESSAGES) {
      const old = messages.firstChild;
      old.querySelectorAll?.('img,video,a').forEach(el => {
        const href = el.src || el.href;
        if (href && href.startsWith('blob:')) {
          const i = blobUrls.indexOf(href);
          if (i > -1) { URL.revokeObjectURL(href); blobUrls.splice(i, 1); }
        }
      });
      messages.removeChild(old);
    }
    scrollBottomSoon();
  }

  let scrollQueued = false;
  function scrollBottomSoon() {
    if (scrollQueued) return;
    scrollQueued = true;
    rAF(() => { scrollQueued = false; chat.scrollTop = chat.scrollHeight; });
  }

  function addText(from, text, me) {
    const d = document.createElement('div');
    d.className = 'msg' + (me ? ' me' : '');
    const head = document.createElement('div');
    head.className = 'from';
    head.textContent = from;
    const body = document.createElement('div');
    body.textContent = text;
    d.append(head, body);
    appendMessage(d);
  }

  function addStatus(text) {
    const d = document.createElement('div');
    d.className = 'status';
    d.textContent = text;
    appendMessage(d);
  }

  function addFile(from, name, mime, blob, me) {
    const d = document.createElement('div');
    d.className = 'msg' + (me ? ' me' : '');

    const head = document.createElement('div');
    head.className = 'from';
    head.textContent = from;
    d.appendChild(head);

    const url = URL.createObjectURL(blob);
    blobUrls.push(url);

    if (mime.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = url;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = name;
      d.appendChild(img);
    } else if (mime.startsWith('video/')) {
      const v = document.createElement('video');
      v.src = url;
      v.controls = true;
      v.playsInline = true;
      v.preload = 'metadata';
      d.appendChild(v);
    }

    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.textContent = `⬇️ ${name} (${fmtSize(blob.size)})`;
    d.appendChild(a);

    appendMessage(d);
  }

  /* name */
  function setMyName(name) {
    myName = name;
    if (myNameText)  myNameText.textContent  = name;
    if (myNameLabel) myNameLabel.textContent = name;
  }

  function showNamePrompt() {
    nameInput.value = myName || '';
    nameOverlay.hidden = false;
    setTimeout(() => nameInput.focus(), 80);
  }

  function submitName() {
    const v = (nameInput.value || '').trim().slice(0, 20)
      || ('guest-' + Math.random().toString(36).slice(2, 6));
    myName = v;
    store.set('ls_name', myName);
    setMyName(myName);
    nameOverlay.hidden = true;
    wsSend({ type: 'hello', clientId, name: myName });
  }

  function requestGuest() {
    guestBtn.disabled = true;
    guestBtn.textContent = 'Menghubungkan...';
    clearTimeout(guestTimer);
    wsSend({ type: 'guest', clientId });
    guestTimer = setTimeout(resetGuestBtn, 6000);
  }

  function resetGuestBtn() {
    clearTimeout(guestTimer);
    guestBtn.disabled = false;
    guestBtn.textContent = 'Continue as guest';
  }

  nameOk.addEventListener('click', submitName);
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitName(); }
  });
  myNameBtn.addEventListener('click', showNamePrompt);
  document.getElementById('editNameBtn').addEventListener('click', showNamePrompt);
  guestBtn.addEventListener('click', requestGuest);

  /* queue */
  function wsSend(msg) {
    if (ws && ws.readyState === 1) {
      try {
        ws.send(typeof msg === 'string' ? msg : JSON.stringify(msg));
        return true;
      } catch {}
    }
    outbox.push(msg);
    return false;
  }

  function flushOutbox() {
    while (outbox.length && ws && ws.readyState === 1) {
      const m = outbox.shift();
      try { ws.send(typeof m === 'string' ? m : JSON.stringify(m)); } catch {}
    }
  }

  function setOnline(on) {
    connDot.classList.toggle('online', !!on);
    const chipDot = myNameBtn.querySelector('.dot');
    if (chipDot) chipDot.classList.toggle('online', !!on);
  }

  /* ws */
  function connect() {
    clearTimeout(connWatchdog);
    ws = new WebSocket(WS_URL);
    ws.binaryType = 'arraybuffer';

    connWatchdog = setTimeout(() => {
      if (!ws || ws.readyState !== 1) {
        try { ws && ws.close(); } catch {}
      }
    }, 6000);

    ws.addEventListener('open', () => {
      clearTimeout(connWatchdog);
      setOnline(true);
      wsSend({ type: 'hello', clientId, name: myName || null });
      flushOutbox();

      clearInterval(pingTimer);
      pingTimer = setInterval(() => {
        if (ws.readyState === 1) {
          try { ws.send('{"type":"ping"}'); } catch {}
        }
      }, 20000);
    });

    ws.addEventListener('message', ev => {
      if (typeof ev.data === 'string') {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        handleControl(msg);
      } else {
        handleBinary(ev.data);
      }
    });

    ws.addEventListener('close', () => {
      clearTimeout(connWatchdog);
      clearInterval(pingTimer);
      setOnline(false);
      addStatus('🔌 Terputus, sambung ulang...');
      setTimeout(connect, 1200);
    });

    ws.addEventListener('error', () => setOnline(false));
  }

  function handleControl(msg) {
    switch (msg.type) {
      case 'users':
        renderUsers(msg.users);
        break;

      case 'welcome':
        resetGuestBtn();
        myName = msg.name;
        store.set('ls_name', myName);
        setMyName(myName);
        nameOverlay.hidden = true;
        break;

      case 'need-name':
        if (nameOverlay.hidden) showNamePrompt();
        break;

      case 'chat':
        addText(msg.from, msg.text, msg.from === myName);
        break;

      case 'file-start':
        incoming.set(msg.fileId, { name: msg.name, mime: msg.mime, chunks: [] });
        addStatus(`⬇️ ${msg.from} mengirim ${msg.name} (${fmtSize(msg.size)})`);
        break;

      case 'file-end': {
        const f = incoming.get(msg.fileId);
        if (!f) return;
        incoming.delete(msg.fileId);
        const blob = new Blob(f.chunks, { type: f.mime });
        addFile(msg.from, f.name, f.mime, blob, false);
        break;
      }
    }
  }

  function handleBinary(buf) {
    const view = new Uint8Array(buf);
    const idLen = view[0];
    if (idLen <= 0 || idLen > 32) return;
    const fileId = new TextDecoder().decode(view.subarray(1, 1 + idLen));
    const f = incoming.get(fileId);
    if (!f) return;
    f.chunks.push(view.subarray(1 + idLen).slice());
  }

  /* users */
  function renderUsers(users) {
    userCount.textContent   = users.length;
    drawerCount.textContent = users.length;

    const fragA = document.createDocumentFragment();
    const fragB = document.createDocumentFragment();
    for (const u of users) {
      const isMe = u.name === myName;
      const li = document.createElement('li');
      if (isMe) li.className = 'me';
      const dot = document.createElement('span');
      dot.className = 'dot';
      const t = document.createElement('span');
      t.textContent = u.name + (isMe ? ' (You)' : '');
      li.append(dot, t);
      fragA.appendChild(li);
      fragB.appendChild(li.cloneNode(true));
    }
    userList.replaceChildren(fragA);
    drawerUserList.replaceChildren(fragB);
  }

  /* text */
  function sendText() {
    const t = textInput.value.trim();
    if (!t) return;
    if (!wsSend({ type: 'chat', text: t })) addStatus('📨 Menunggu koneksi...');
    addText(myName, t, true);
    textInput.value = '';
  }
  sendBtn.addEventListener('click', sendText);
  textInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendText(); }
  });

  /* file */
  fileBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const files = fileInput.files;
    if (!files || !files.length) return;
    for (let i = 0; i < files.length; i++) await sendFile(files[i]);
    fileInput.value = '';
  });

  function readBlob(blob) {
    if (blob.arrayBuffer) return blob.arrayBuffer();
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsArrayBuffer(blob);
    });
  }

  async function sendFile(file) {
    if (!ws || ws.readyState !== 1) {
      addStatus('⚠️ Tunggu koneksi siap dulu...');
      return;
    }
    if (file.size > WARN_SIZE) {
      addStatus(`⚠️ ${file.name} besar (${fmtSize(file.size)}), mungkin lambat`);
    }

    const fileId = Math.random().toString(36).slice(2, 10);
    ws.send(JSON.stringify({
      type: 'file-start',
      fileId,
      name: file.name,
      mime: file.type || 'application/octet-stream',
      size: file.size
    }));

    const idBytes   = new TextEncoder().encode(fileId);
    const headerLen = 1 + idBytes.length;
    let offset = 0, idx = 0;

    while (offset < file.size) {
      if (ws.readyState !== 1) { addStatus('⚠️ Koneksi putus saat kirim'); return; }

      const buf = await readBlob(file.slice(offset, offset + CHUNK));
      const packet = new Uint8Array(headerLen + buf.byteLength);
      packet[0] = idBytes.length;
      packet.set(idBytes, 1);
      packet.set(new Uint8Array(buf), headerLen);

      const payload = (packet.byteOffset === 0 && packet.byteLength === packet.buffer.byteLength)
        ? packet.buffer
        : packet.slice().buffer;

      while (ws.bufferedAmount > HIGH_WATER) {
        if (ws.readyState !== 1) { addStatus('⚠️ Koneksi putus'); return; }
        await sleep(20);
      }

      try { ws.send(payload); }
      catch (e) { addStatus('⚠️ Gagal kirim: ' + e.message); return; }

      offset += buf.byteLength;
      if (++idx % 8 === 0) await sleep(0);
    }

    ws.send(JSON.stringify({ type: 'file-end', fileId }));
    addFile(myName, file.name, file.type || 'application/octet-stream', file, true);
  }

  /* drag & drop */
  document.addEventListener('dragenter', e => {
    if (!e.dataTransfer?.types?.includes('Files')) return;
    e.preventDefault();
    dropzone.hidden = false;
  });

  document.addEventListener('dragover', e => {
    if (!e.dataTransfer?.types?.includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });

  document.addEventListener('dragleave', e => {
    if (!e.relatedTarget || !document.contains(e.relatedTarget)) {
      dropzone.hidden = true;
    }
  });

  document.addEventListener('drop', async e => {
    if (!e.dataTransfer?.types?.includes('Files')) return;
    e.preventDefault();
    dropzone.hidden = true;
    const files = Array.from(e.dataTransfer.files);
    for (const f of files) await sendFile(f);
  });

  /* qr */
  async function showQr() {
    try {
      const r = await fetch('/qr');
      const j = await r.json();
      qrImg.src = j.qr;
      qrUrl.textContent = j.url;
      qrModal.hidden = false;
    } catch { addStatus('⚠️ Gagal ambil QR'); }
  }
  document.getElementById('qrBtn').addEventListener('click', showQr);
  document.getElementById('qrBtn2').addEventListener('click', showQr);
  document.getElementById('qrClose').addEventListener('click', () => {
    qrModal.hidden = true;
  });
  qrModal.addEventListener('click', e => {
    if (e.target === qrModal) qrModal.hidden = true;
  });

  /* drawer */
  menuBtn.addEventListener('click', () => drawer.classList.add('open'));
  drawerClose.addEventListener('click', () => drawer.classList.remove('open'));
  drawer.addEventListener('click', e => {
    if (e.target === drawer) drawer.classList.remove('open');
  });

  /* keyboard */
  // if (window.visualViewport) {
  //   const vv = window.visualViewport;
  //   const fit = () => {
  //     document.body.style.height = vv.height + 'px';
  //     scrollBottomSoon();
  //   };
  //   vv.addEventListener('resize', fit);
  //   vv.addEventListener('scroll', fit);
  // }

  /* boot */
  if (myName) setMyName(myName);
  if (!myName) showNamePrompt();
  connect();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && (!ws || ws.readyState > 1)) connect();
  });
})();
</script>
