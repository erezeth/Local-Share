name: Bug report
description: Report a reproducible problem with Local Share
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real access tokens or private file contents. For security issues, follow SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `pnpm start`
        2. Open ...
        3. Send ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD` if available.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node.js version, browser/device, HTTP or HTTPS
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / token
        - WebSocket / chat
        - File transfer
        - UI / mobile layout
        - QR / HTTP route
        - Tests / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs and browser console output. Remove tokens and sensitive data.
      render: shell
